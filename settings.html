<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <link type="text/css" rel="stylesheet" href="../assessment-common/settings.css">
  <link rel="stylesheet" href="./settings.css">
  <script src="//cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
  <script src="//unpkg.com/tiny-markdown-editor/dist/tiny-mde.min.js"></script>
  <link
      rel="stylesheet"
      type="text/css"
      href="//unpkg.com/tiny-markdown-editor/dist/tiny-mde.min.css"
  />
  <script type="text/javascript" src="../assessment-common/helper.js"></script>
  <script type="text/javascript" src="./settings.js"></script>
</head>
<body>
<div id="settings-content" class="codio-assessment-settings-content">
  <div class="codio-assessment-settings-form-control">
    <label for="instructions" class="codio-assessment-settings-form-label">Instructions</label>
    <div class="codio-assessment-settings-form-input-container">
      <div id="instructions-command-bar"></div>
      <textarea id="instructions" name="instructions" rows="4" class="codio-assessment-settings-form-input"></textarea>
    </div>
  </div>
  <div class="settings-commands">
    <div class="codio-assessment-settings-form-control">
      <label for="command" class="codio-assessment-settings-form-label">Command</label>
      <div class="codio-assessment-settings-form-input-container">
        <input id="command" name="command" class="codio-assessment-settings-form-input" type="text"/>
      </div>
    </div>
    <div class="codio-assessment-settings-form-control">
      <label for="preExecCommand" class="codio-assessment-settings-form-label">Pre-Exec Command(Optional)</label>
      <div class="codio-assessment-settings-form-input-container">
        <input id="preExecCommand" name="preExecCommand" class="codio-assessment-settings-form-input"/>
      </div>
    </div>
  </div>
  <div class="codio-assessment-settings-form-control">
    <label for="timeout" class="codio-assessment-settings-form-label">Timeout</label>
    <div class="codio-assessment-settings-form-input-container">
      <input id="timeout" name="timeout" class="codio-assessment-settings-form-input" type="number"/>
    </div>
  </div>
</div>
</body>
</html>
